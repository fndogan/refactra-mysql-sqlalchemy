name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,openai]'
      - name: Compile
        run: python -m compileall -q src/refactra_mysql tests
      - name: Lint
        run: python -m ruff check src/refactra_mysql tests
      - name: Type check
        run: python -m mypy src/refactra_mysql tests
      - name: Test
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
